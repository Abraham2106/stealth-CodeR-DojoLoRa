name: CPU preparation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU checks
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . transformers==5.19.0 peft==0.21.2 safetensors==0.8.0
      - run: python -m unittest discover -s tests -v
      - run: marimo check notebooks/coder_molab.py
      - run: marimo check notebooks/train_a_molab.py
      - run: python -m compileall -q src notebooks
